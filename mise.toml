[tools]
watchexec = "2"
rust = "1.96.0"
node = "22"
pnpm = "11.9.0"
taplo = "0.10.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
POWERPLANT_ENVIRONMENT = "development"
POWERPLANT_BIND_ADDRESS = "localhost:4000"
POWERPLANT_PUBLIC_ORIGIN = "http://localhost:4000"

[tasks.build]
description = "Build Power Plant"
run = "cargo build -p powerplant --release"

[tasks.server]
alias = "s"
description = "Run Power Plant"
run = "cargo run -p powerplant"

[tasks.dev]
alias = "d"
description = "Run the Power Plant Rust web server with asset and template reloads"
run = """
#!/usr/bin/env bash
set -euo pipefail

assets_pid=""
cleanup() {
  trap - INT TERM EXIT
  if [ -n "$assets_pid" ]; then
    kill "$assets_pid" 2>/dev/null || true
  fi
}
trap cleanup INT TERM EXIT

mkdir -p app/static-development
rm -f app/static-development/.vite/manifest.json

pnpm vite build app --watch --mode development --logLevel warn &
assets_pid=$!

while [ ! -f app/static-development/.vite/manifest.json ]; do
  if ! kill -0 "$assets_pid" 2>/dev/null; then
    wait "$assets_pid"
    exit $?
  fi
  sleep 0.1
done

watchexec --restart \
  --watch app/src \
  --watch app/askama.toml \
  --watch app/Cargo.toml \
  --watch Cargo.lock \
  -- cargo run -p powerplant --features dev
"""

[tasks.format]
alias = "f"
description = "Format Rust and front-end files"
run = [
  "taplo format",
  "pnpm prettier --write --cache --log-level warn .",
  "cargo fmt --all",
]

[tasks.check]
description = "Check the Power Plant Rust project"
run = [
  "taplo format --check",
  "pnpm tsgo --noEmit --incremental --tsBuildInfoFile .cache/tsgo.tsbuildinfo --project app/tsconfig.json",
  "cargo clippy --all-targets --all-features -- --deny warnings",
  "mise run catalogue:check",
]

[tasks.test]
description = "Run the Power Plant test suite"
run = [
  "pnpm test",
  "cargo test --workspace --all-features --quiet",
]

[tasks.clean]
alias = "c"
description = "Format and check the Power Plant Rust project"
run = [
  "mise run format",
  "mise run check",
]

[tasks."catalogue:update"]
description = "Update the models.dev catalogue and provider logos"
run = "cargo run -p powerplant --bin catalogue -- update"

[tasks."catalogue:check"]
description = "Validate the checked-in models.dev catalogue and provider logos"
run = "cargo run -p powerplant --bin catalogue -- check"

[tasks."assets:build"]
description = "Build front-end assets"
run = "pnpm vite build app"

[tasks."assets:watch"]
description = "Watch and build development front-end assets"
run = "pnpm vite build app --watch --mode development"
