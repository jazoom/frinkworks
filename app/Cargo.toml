[package]
name = "powerplant"
default-run = "powerplant"
version = "0.0.1"
edition = "2024"
publish = false

[features]
dev = ["dep:tower-livereload"]

[dependencies]
ammonia = "4.1.4"
askama = "0.16.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
cap-std = "4.0.3"
clap = { version = "4.6.6", features = ["derive"] }
cookie = "0.18.2"
futures-util = "0.3.34"
hypergraft = "0.1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
microsandbox = "0.6.15"
nix = { version = "0.31.3", default-features = false, features = ["process", "signal", "user"] }
pulldown-cmark = "0.13.4"
quick-xml = "0.39.2"
rand = { version = "0.10.2", default-features = false, features = ["sys_rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "rustls"] }
rfd = "0.17.2"
rig-core = "0.42.0"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
similar = "3.2.0"
tiktoken-rs = { version = "0.12.0", default-features = false }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tower-livereload = { version = "0.10.3", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
