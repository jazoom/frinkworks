<div
  {% if !has_stored_providers %}
    class="connect-sheet border-base-300 rounded-[3px] border px-5 pt-6 pb-3
    sm:px-8 sm:pt-7"
  {% endif %}
>
  {% include "connect/templates/connection.html" %}
</div>
{% if has_stored_providers %}
  <section class="mt-8" aria-labelledby="connected-providers-title">
    <h2 id="connected-providers-title" class="text-lg font-semibold">
      Connected providers
    </h2>
    <ul class="record-list mt-3">
      {% for provider in stored %}
        <li class="record-row">
          <span class="flex min-w-0 items-center gap-3">
            <span
              class="provider-logo provider-logo-{{ provider.value }} shrink-0"
              aria-hidden="true"
            ></span>
            <span>
              <span class="block font-medium">{{ provider.label }}</span>
              <span class="text-quiet text-sm">{{ provider.method }}</span>
            </span>
          </span>
          <form data-graft method="post" action="/connect/forget">
            <input type="hidden" name="provider" value="{{ provider.value }}" />
            <button
              class="btn btn-ghost btn-sm"
              type="submit"
              aria-label="Forget {{ provider.label }}"
            >
              Forget
            </button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
