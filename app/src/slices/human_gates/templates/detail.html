<section id="gate-detail" class="mx-auto w-full max-w-4xl space-y-6 p-5">
  <a href="{{ back_href }}" data-graft class="link">Back</a>
  <h1 class="text-2xl font-semibold">{{ gate_name }}</h1>
  <div class="prose max-w-none">{{ text|safe }}</div>
  {% if needs_recovery %}
    <p class="text-sm">
      The workflow needs fresh execution consent before it can continue.
    </p>
  {% else if awaiting %}
    <form
      data-graft
      method="post"
      action="/runs/{{ run_id }}/gates/{{ gate_id }}/approve"
      class="space-y-4"
    >
      <input type="hidden" name="gate-revision" value="{{ revision }}" />
      <input type="hidden" name="plan" value="{{ plan }}" />
      <div class="flex flex-wrap gap-3">
        <button type="submit" class="btn btn-primary">Accept plan</button>
        <button
          type="submit"
          formaction="/runs/{{ run_id }}/gates/{{ gate_id }}/cancel"
          class="btn btn-ghost"
        >
          End workflow
        </button>
      </div>
    </form>
    {% if can_request_revision %}
      <form
        data-graft
        method="post"
        action="/runs/{{ run_id }}/gates/{{ gate_id }}/request-revision"
        class="space-y-4"
      >
        <input type="hidden" name="gate-revision" value="{{ revision }}" />
        <input type="hidden" name="plan" value="{{ plan }}" />
        <label class="form-control gap-2">
          <span>Revision note</span>
          <textarea
            name="note"
            class="textarea textarea-bordered w-full"
            rows="4"
            maxlength="8192"
          ></textarea>
        </label>
        <button type="submit" class="btn btn-outline">Request changes</button>
      </form>
    {% endif %}
  {% endif %}
</section>
