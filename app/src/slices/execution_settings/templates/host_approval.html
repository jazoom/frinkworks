<fieldset class="space-y-2">
  <legend class="text-sm font-medium">Command approval</legend>
  <p class="text-quiet max-w-[65ch] text-xs">
    Automatic approval skips command prompts. Directory permissions still apply.
    This setting does not approve commands that already await a decision.
  </p>
  <label
    class="border-base-300 flex min-h-12 items-center gap-2 border p-3 text-sm"
  >
    <input
      {% if !settings_form.is_empty() %}form="{{ settings_form }}"{% endif %}
      class="radio radio-sm"
      type="radio"
      name="{{ field_prefix }}{% if field_prefix.is_empty() %}host_approval{% else %}settings-host-approval{% endif %}"
      value="ask-each-time"
      {% if !host_approval_automatic %}checked{% endif %}
    />
    <span>Ask each time</span>
  </label>
  <label
    class="border-base-300 flex min-h-12 items-center gap-2 border p-3 text-sm"
  >
    <input
      {% if !settings_form.is_empty() %}form="{{ settings_form }}"{% endif %}
      class="radio radio-sm"
      type="radio"
      name="{{ field_prefix }}{% if field_prefix.is_empty() %}host_approval{% else %}settings-host-approval{% endif %}"
      value="automatic"
      {% if host_approval_automatic %}checked{% endif %}
    />
    <span>Automatic (YOLO)</span>
  </label>
</fieldset>
