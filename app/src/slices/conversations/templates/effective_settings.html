<div
  class="workspace-effective flex flex-wrap items-center gap-x-3 gap-y-1 px-6 pb-3 text-xs"
>
  <button
    type="button"
    class="btn btn-ghost btn-sm h-auto text-left"
    {% if !self.is_new() %}
      popovertarget="conversation-settings" popovertargetaction="show"
    {% endif %}
    data-settings-section="conversation-directory-heading"
    aria-label="{% if location_host %}
      Manage work locations
    {% else %}
      Manage directories
    {% endif %}"
  >
    <svg class="workspace-icon" aria-hidden="true">
      {% if directories.is_empty() %}
        <use href="/static/images/workspace-icons.svg#no-access" />
      {% else %}
        <use href="/static/images/workspace-icons.svg#folder" />
      {% endif %}
    </svg>
    <span class="flex flex-wrap gap-x-2">
      {% if directories.is_empty() %}
        <span class="directory-access-label directory-access-empty">
          {% if location_host %}
            No work locations
          {% else %}
            No directory access
          {% endif %}
        </span>
      {% else %}
        {% for directory in directories %}
          <span
            class="directory-access-label {% if directory.available && !directory.pending_approval && !location_host %}directory-access-approved{% endif %} break-all"
            >{{ directory.name }} ·
            {% if location_host %}Work location{% else %}{{ directory.access_label }}{% endif %}{% if !directory.available %}
              · Cannot access directory
            {% else if directory.pending_approval %}
              · Pending approval
            {% endif %}</span
          >
        {% endfor %}
      {% endif %}
    </span>
  </button>
  <button
    type="button"
    class="btn btn-ghost btn-sm ml-auto h-auto gap-2"
    popovertarget="conversation-settings"
    popovertargetaction="show"
    data-settings-section="conversation-execution-heading"
  >
    <svg class="workspace-icon" aria-hidden="true">
      <use href="/static/images/workspace-icons.svg#cube" />
    </svg>
    {% if location_host %}
      {{ host_summary }}
    {% else %}
      <span class="flex flex-wrap items-baseline gap-x-2">
        <span>Sandbox ·</span>
        <span class="text-quiet" data-conversation-environment-summary
          >{{ environment_summary }}</span
        >
      </span>
    {% endif %}
  </button>
</div>
