<section class="space-y-4 p-5" aria-labelledby="conversation-workflow-heading">
  <h3
    id="conversation-workflow-heading"
    class="text-xl font-semibold break-words"
  >
    {{ run.name }}
  </h3>
  <p>
    <span class="badge state-badge" data-state="{{ run.state }}"
      >{{ run.state }}</span
    >
  </p>
  <dl class="border-base-300 space-y-1 border-y py-4 text-sm">
    <dt class="text-quiet">Current phase</dt>
    <dd class="text-lg font-semibold break-words">{{ run.current_step }}</dd>
  </dl>
  {% if run.run_terminal %}<p class="text-sm">{{ run.result }}</p>{% endif %}
  <a href="{{ run.run_href }}" data-graft class="link text-sm"
    >View workflow activity</a
  >
</section>
