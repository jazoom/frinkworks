<div class="configured-draft m-auto w-full max-w-3xl py-8 text-center">
  <h2 class="font-semibold text-balance">Work on your files</h2>
  <p class="text-quiet mt-3 text-lg">Describe the change you want to make.</p>
  <section
    class="draft-configuration mt-7 text-left"
    aria-label="Draft configuration"
  >
    <ul class="space-y-2 p-3" aria-label="Configured directories">
      {% for directory in directories %}
        <li>
          <button
            type="button"
            class="btn btn-ghost flex h-auto w-full flex-wrap justify-start gap-3 p-2 text-left font-normal"
            popovertarget="conversation-settings"
            popovertargetaction="show"
            data-settings-section="conversation-directory-heading"
            title="Open directory setup"
          >
            <svg class="workspace-icon shrink-0" aria-hidden="true">
              <use href="/static/images/workspace-icons.svg#folder" />
            </svg>
            <span class="min-w-0 flex-[1_1_12rem]">
              <span class="block text-lg font-semibold break-words">
                {{ directory.name }}
              </span>
              <span class="text-quiet mt-0.5 block font-mono text-sm break-all">
                {{ directory.host_path }}
              </span>
            </span>
            <span
              class="directory-access-label {% if directory.available && !directory.pending_approval && !location_host %}directory-access-approved{% endif %}"
            >
              {% if location_host %}Work location{% else %}{{ directory.access_label }}{% endif %}
              {% if !directory.available %}
                · Unavailable
              {% else if directory.pending_approval && !location_host %}
                · Pending approval
              {% endif %}
            </span>
          </button>
        </li>
      {% endfor %}
    </ul>
    <div
      class="border-base-300 flex flex-wrap gap-x-2 gap-y-1 border-t px-3 py-2"
    >
      <button
        type="button"
        class="btn btn-ghost h-auto min-w-0 flex-1 justify-start gap-3 p-2 text-left text-base font-normal"
        popovertarget="conversation-settings"
        popovertargetaction="show"
        data-settings-section="conversation-execution-heading"
        title="Open execution setup"
      >
        <svg class="workspace-icon shrink-0" aria-hidden="true">
          <use href="/static/images/workspace-icons.svg#cube" />
        </svg>
        <span class="break-words"
          >{% if location_host %}
            {{ host_summary }}
          {% else %}
            Sandbox ·
            <span data-conversation-environment-summary
              >{{ environment_summary }}</span
            >
          {% endif %}</span
        >
      </button>
      {% if !location_host %}
        <button
          type="button"
          class="btn btn-ghost text-quiet h-auto justify-start p-2 text-left text-base font-normal"
          popovertarget="conversation-settings"
          popovertargetaction="show"
          data-settings-section="conversation-execution-heading"
          title="Open network setup"
        >
          Network:
          <span data-conversation-network-summary>{{ network_summary }}</span>
        </button>
      {% endif %}
    </div>
  </section>
  <p class="text-quiet mt-5 text-base">{{ self.draft_access_note() }}</p>
</div>
