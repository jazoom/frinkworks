{% if let Some(saved) = self.saved() %}
  <form
    id="command-directory-form"
    method="post"
    action="/conversations/{{ saved.id }}/directories/start"
    data-graft
    hidden
  >
    <input type="hidden" name="revision" value="{{ saved.revision }}" />
  </form>
{% endif %}
<button
  id="command-directory-submit"
  form="{% if self.is_new() %}conversation-composer{% else %}command-directory-form{% endif %}"
  {% if self.is_new() %}formaction="/conversations/new/directories/start"{% endif %}
  formmethod="post"
  type="submit"
  hidden
>
  Change command start directory
</button>
