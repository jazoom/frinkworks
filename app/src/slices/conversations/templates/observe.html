{% if active %}
  <div
    data-island="observe"
    data-observe-active="true"
    data-observe-target="conversation-observe"
  >
    <form method="get" action="/conversations/{{ id }}" data-graft>
      <input type="hidden" name="job" value="{{ job_id }}" />
      <input type="hidden" name="cursor" value="{{ cursor }}" />
      {% if historical %}
        <input type="hidden" name="historical" value="true" />
      {% endif %}
    </form>
  </div>
{% endif %}
