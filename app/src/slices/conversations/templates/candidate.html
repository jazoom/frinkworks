<section
  id="conversation-candidate"
  class="space-y-4 p-5"
  aria-labelledby="conversation-plan-heading"
>
  <h3 id="conversation-plan-heading" class="text-xl font-semibold">
    Review the plan
  </h3>
  <div class="prose max-w-none">{{ gate.plan_html|safe }}</div>
  <a href="{{ gate.diff_href }}" data-graft class="link text-sm"
    >Open plan review</a
  >
  <form
    data-graft
    method="post"
    action="/runs/{{ gate.run_id }}/gates/{{ gate.gate_id }}/approve"
  >
    <input type="hidden" name="gate-revision" value="{{ gate.revision }}" />
    <input type="hidden" name="plan" value="{{ gate.candidate }}" />
    <input type="hidden" name="surface" value="conversation" />
    <button type="submit" class="btn btn-primary w-full">Accept plan</button>
  </form>
  {% if gate.can_request_revision %}
    <form
      data-graft
      method="post"
      action="/runs/{{ gate.run_id }}/gates/{{ gate.gate_id }}/request-revision"
      class="space-y-3"
    >
      <input type="hidden" name="gate-revision" value="{{ gate.revision }}" />
      <input type="hidden" name="plan" value="{{ gate.candidate }}" />
      <input type="hidden" name="surface" value="conversation" />
      <label class="form-control gap-2"
        ><span>Revision note</span
        ><textarea
          name="note"
          class="textarea textarea-bordered w-full"
          rows="3"
          required
        ></textarea>
      </label>
      <button type="submit" class="btn btn-outline w-full">
        Request changes
      </button>
    </form>
  {% endif %}
  <form
    data-graft
    method="post"
    action="/runs/{{ gate.run_id }}/gates/{{ gate.gate_id }}/cancel"
  >
    <input type="hidden" name="gate-revision" value="{{ gate.revision }}" />
    <input type="hidden" name="plan" value="{{ gate.candidate }}" />
    <input type="hidden" name="surface" value="conversation" />
    <button type="submit" class="btn btn-ghost w-full">End workflow</button>
  </form>
</section>
