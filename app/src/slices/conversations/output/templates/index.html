{% if !error.is_empty() %}
  <p class="alert alert-warning" role="alert">{{ error }}</p>
{% else if chunks.is_empty() %}
  <p class="text-quiet text-xs">No output</p>
{% else %}
  {% for chunk in chunks %}
    <div class="mt-2 first:mt-0">
      <pre
        class="text-xs break-words whitespace-pre-wrap"
        tabindex="0"
        aria-label="{{ chunk.stream }} output"
      ><code>{{ chunk.text }}</code></pre>
    </div>
  {% endfor %}
{% endif %}

{% if truncated %}
  <p class="text-warning text-sm" role="status">
    The retained output reached its storage limit. Later output is not
    available.
  </p>
{% endif %}
