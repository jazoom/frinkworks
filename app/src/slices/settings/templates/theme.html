{% if let Some(message) = error %}
  <p class="text-error text-sm" role="alert">{{ message }}</p>
{% endif %}
<div class="settings-control max-w-xs" data-active-theme="{{ theme }}">
  <select
    id="theme-select"
    name="theme"
    class="select"
    data-theme-select
    aria-labelledby="settings-appearance"
  >
    {% for option in themes %}
      <option
        value="{{ option.as_str() }}"
        {% if theme == option.as_str() %}selected{% endif %}
      >
        {{ option.label() }}
      </option>
    {% endfor %}
  </select>
</div>
