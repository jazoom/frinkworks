<main
  data-section="settings"
  class="workspace-catalogue flex min-h-0 w-full flex-1 flex-col"
>
  <header
    class="catalogue-head border-base-300 flex items-center justify-between gap-4 border-b py-3.5"
  >
    <div class="flex min-w-0 items-center gap-2">
      <button
        type="button"
        class="btn btn-ghost btn-sm workspace-menu"
        data-workspace-menu
        aria-controls="workspace-index"
        aria-expanded="false"
        aria-label="Menu"
      >
        <svg class="workspace-icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h1>Settings</h1>
    </div>
  </header>
  <div
    class="min-h-0 flex-1 overflow-y-auto px-11 pt-8 pb-[70px] max-[700px]:px-5 max-[700px]:pt-6"
  >
    <section
      class="catalogue-settings-section"
      aria-labelledby="settings-appearance"
    >
      <h2 id="settings-appearance">Theme</h2>
      <form
        id="theme-setting"
        method="post"
        action="/settings/theme"
        data-graft
        data-island="theme-selector"
        class="catalogue-settings-stack"
      >
        {% include "settings/templates/theme.html" %}
      </form>
    </section>

    <section
      class="catalogue-settings-section"
      aria-labelledby="settings-catalogue-heading"
    >
      <h2 id="settings-catalogue-heading">Model catalogue</h2>
      <form
        id="model-catalogue-setting"
        method="post"
        action="/settings/model-catalogue/refresh"
        data-graft
        class="catalogue-settings-stack"
      >
        {% include "settings/templates/model_catalogue.html" %}
      </form>
    </section>

    <section
      class="catalogue-settings-section catalogue-settings-danger"
      aria-labelledby="local-data-heading"
    >
      <h2 id="local-data-heading">Local data</h2>
      <form
        id="local-data-reset"
        method="post"
        action="/settings/local-data/reset"
        data-graft
        class="catalogue-settings-stack"
      >
        {% include "settings/templates/local_data.html" %}
      </form>
    </section>
  </div>
</main>
