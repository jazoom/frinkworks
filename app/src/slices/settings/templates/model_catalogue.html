<div class="max-w-[60ch]">
  <p class="text-quiet text-sm">
    Power Plant updates model capabilities and thinking options from models.dev
    once a day. Check for updates now to force a refresh.
  </p>
  {% if let Some(status) = catalogue_status %}
    <p class="text-success mt-2 text-sm" role="status">{{ status }}</p>
  {% endif %}
  {% if let Some(error) = catalogue_error %}
    <p class="text-error mt-2 text-sm" role="alert">{{ error }}</p>
  {% endif %}
</div>
<button class="btn btn-outline btn-sm" type="submit">Check for updates</button>
