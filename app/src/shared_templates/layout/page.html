{% block page %}
  <main
    data-section="{% block section %}{% endblock %}"
    {% block context %}{% endblock %}
    class="workspace-catalogue flex min-h-0 w-full min-w-0 flex-1 flex-col"
  >
    <header
      class="catalogue-head border-base-300 flex flex-wrap items-center justify-between gap-4 border-b"
    >
      <div class="flex min-w-0 flex-[1_1_16rem] items-center gap-2">
        <button
          type="button"
          class="btn btn-ghost btn-sm workspace-menu"
          data-workspace-menu
          aria-controls="workspace-index"
          aria-expanded="false"
          aria-label="Menu"
        >
          <svg class="workspace-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="min-w-0 break-words">
          <h1>{% block heading %}{% endblock %}</h1>
          {% block description %}{% endblock %}
        </div>
      </div>
      {% block actions %}{% endblock %}
    </header>
    <div
      class="min-h-0 flex-1 overflow-y-auto px-11 pt-8 pb-[70px] max-[700px]:px-5 max-[700px]:pt-6"
    >
      {% block page_content %}{% endblock %}
    </div>
  </main>
{% endblock %}
