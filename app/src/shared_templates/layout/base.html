<!doctype html>
<html
  lang="en-AU"
  {% if theme != "system" %}data-theme="{{ theme }}"{% endif %}
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta name="application-name" content="Frinkworks" />
    <meta name="description" content="Frinkworks is a local coding agent." />
    <link
      rel="icon"
      href="/static/images/frinkworks.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="{{ css_path }}" />
    <script type="module" src="{{ js_path }}" nonce="{{ csp_nonce }}"></script>
  </head>
  <body class="text-base-content min-h-screen">
    {% block body %}{% endblock %}
    <div
      data-graft-feedback
      class="alert alert-error fixed right-4 bottom-4 z-50 max-w-md"
      role="alert"
      aria-live="assertive"
      hidden
    >
      <span data-graft-feedback-safe>
        We could not update the page. Check your connection and try again.
      </span>
      <span data-graft-feedback-blocked hidden>
        Another request is active. This command was not sent. You can try again
        after that request finishes.
      </span>
      <span data-graft-feedback-uncertain hidden>
        The change may have been saved. Reload the page before trying again.
      </span>
      <button
        class="btn btn-ghost btn-sm"
        type="button"
        data-graft-feedback-dismiss
      >
        Dismiss
      </button>
      <button
        class="btn btn-ghost btn-sm"
        type="button"
        data-graft-feedback-reload
        hidden
      >
        Reload page
      </button>
    </div>
  </body>
</html>
