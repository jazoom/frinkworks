{% extends "layout/base.html" %}
{% let csp_nonce = "nonce"|crate::template_filters::csp_nonce -%}
{% block body %}
  <a class="skip-link" href="#connect-main">Skip to main content</a>
  <div class="connect-frame min-h-dvh px-4 pt-6 pb-12 sm:px-6 sm:pt-14">
    <div class="mx-auto w-full max-w-[35rem]">
      <header class="mb-7 flex px-2 sm:px-0">
        <a
          href="/connect"
          data-graft
          class="connect-brand inline-flex items-center gap-3"
        >
          <img
            src="/static/images/logo.svg"
            alt=""
            width="44"
            height="44"
            class="frinkworks-mark"
          />
          {% include "layout/wordmark.html" %}
        </a>
      </header>
      <div id="connect-main" tabindex="-1">{{ content|safe }}</div>
      <p class="text-quiet mt-6 px-4 text-center text-[13px]">
        Frinkworks stores your key or plan login on this machine.
      </p>
    </div>
  </div>
{% endblock %}
